# Optional local "production-like" stack: PostgreSQL + Gunicorn + WhiteNoise.
#   docker compose up --build
# Then open http://localhost:8000 and log in with admin / Admin#2026.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rukomeza
      POSTGRES_USER: rukomeza
      POSTGRES_PASSWORD: rukomeza_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rukomeza -d rukomeza"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_demo &&
             gunicorn marketplace_project.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "local-docker-secret-change-me-in-production"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_SECURE_SSL_REDIRECT: "False"
      DATABASE_URL: "postgresql://rukomeza:rukomeza_local@db:5432/rukomeza"
      MOCK_GATEWAY_SECRET: "local-docker-webhook-secret"
      SEED_DEMO: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media

volumes:
  postgres_data:
  media_data:
